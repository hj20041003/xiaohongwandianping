<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新增地址 · 小红碗</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/ticket.css">
</head>
<body>
<div id="app">

  <header class="hd">
    <button class="hd__btn" type="button" @click="goBack" aria-label="返回">
      <tk-icon name="back" :size="20"></tk-icon>
    </button>
    <h1 class="hd__t">{{ isEdit ? "编辑地址" : "新增地址" }}</h1>
    <button class="hd__btn hd__btn--txt" type="button" @click="submit"
            :disabled="saving" :style="saving ? 'opacity:.5' : 'color:var(--ticket)'">
      {{ saving ? "保存中" : "保存" }}
    </button>
  </header>

  <main class="main main--nofoot">

    <section class="sec">
      <label class="fld">
        <span class="fld__lb">收货人</span>
        <input class="inp" v-model="form.name" maxlength="32"
               placeholder="姓名或称呼" autocomplete="name">
      </label>

      <label class="fld">
        <span class="fld__lb">手机号</span>
        <input class="inp inp--num" v-model="form.phone" maxlength="11"
               type="tel" inputmode="numeric"
               placeholder="11 位手机号" autocomplete="tel">
      </label>

      <div class="fld">
        <span class="fld__lb">所在地区</span>
        <div class="card">
          <div class="row row--link" @click="picker = true">
            <span class="row__k">省 / 市 / 区</span>
            <span class="row__v" :class="{ faint: !form.province }">
              {{ regionText || "去选择" }}
            </span>
            <tk-icon name="right" :size="15" class="row__chev"></tk-icon>
          </div>
        </div>
      </div>

      <label class="fld" style="margin-bottom:0">
        <span class="fld__lb">详细地址</span>
        <textarea class="txa" v-model="form.detail" maxlength="255"
                  style="min-height:96px"
                  placeholder="街道 / 门牌号，比如「金华路 29 号 3 单元 1102」"></textarea>
      </label>
    </section>

    <section class="sec">
      <div class="sub">标签</div>
      <div class="chips">
        <button class="chip" type="button" v-for="(t, i) in tags" :key="i"
                :class="{ on: form.tag === i }" @click="form.tag = i">
          {{ t }}
        </button>
      </div>
    </section>

    <section class="sec">
      <label class="chk">
        <input type="checkbox" v-model="form.isDefault" :true-value="1" :false-value="0"
               :disabled="lockedDefault">
        <span class="chk__box"><tk-icon name="check" :size="12"></tk-icon></span>
        <span>
          设为默认地址
          <template v-if="lockedDefault">
            <br><span class="faint">这条已经是默认地址了，不能取消。想换一个，去把别的地址设为默认。</span>
          </template>
        </span>
      </label>
    </section>

    <section class="sec">
      <div class="note-box">
        <span class="note-box__ic"><tk-icon name="info" :size="15"></tk-icon></span>
        <span>
          地址簿是<b>私有数据</b>，只有你自己看得见。
          <template v-if="!isEdit && !hasAddress">这是你的第一条地址，保存后会自动成为默认地址。</template>
        </span>
      </div>
    </section>

    <section class="sec" v-if="isEdit">
      <button class="btn btn--g btn--full" type="button" @click="askDelete">
        删除这条地址
      </button>
    </section>

  </main>

  <!-- 省 / 市 / 区 三级选择 -->
  <tk-region :open="picker" :value="form"
             @change="onRegion" @close="picker = false"></tk-region>

  <!-- 删除确认 -->
  <template v-if="confirming">
    <div class="mask" @click="confirming = false"></div>
    <div class="sheet" role="dialog" aria-label="确认删除">
      <div class="sheet__hd">
        <span class="sheet__t">删掉这条地址？</span>
        <button class="hd__btn" type="button" @click="confirming = false" aria-label="关闭">
          <tk-icon name="close" :size="18"></tk-icon>
        </button>
      </div>
      <div class="sheet__bd">
        <div class="pad" style="padding:16px 16px 12px">
          <div class="t-sm muted">
            {{ form.name }} · {{ form.phone }}<br>
            {{ form.city }} · {{ form.detail }}
          </div>
          <div class="t-sm faint" style="margin-top:12px">删掉之后没法恢复。</div>
        </div>
        <div class="pad" style="padding:0 16px 16px;display:flex;gap:10px">
          <button class="btn btn--g btn--sm" type="button" style="flex:1"
                  @click="confirming = false">再想想</button>
          <button class="btn btn--p btn--sm" type="button" style="flex:1"
                  :disabled="deleting" @click="doDelete">
            {{ deleting ? "删除中…" : "删除" }}
          </button>
        </div>
      </div>
    </div>
  </template>

</div>

<script src="/js/vue.js"></script>
<script src="/js/axios.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/ui.js"></script>
<script>
/* ⚠️ 必须和后端 RegexPatterns.PHONE_REGEX 逐字一致。
   上一轮就吃过一次亏：前端放行、后端拒绝，用户看到一句"手机号格式错误"
   完全不知道该改哪儿。改这里时同步改 Java 那处。 */
var PHONE_RE = /^1[3-9]\d{9}$/;
var TAGS = ["家", "公司", "学校", "其他"];

new Vue({
  el: "#app",
  data: {
    id: null,
    saving: false,
    deleting: false,
    confirming: false,
    picker: false,
    tags: TAGS,
    // 编辑一条本来就是默认的地址时，不允许取消默认
    lockedDefault: false,
    // 地址簿为空时，保存后会自动成为默认 —— 文案要提前说清楚
    hasAddress: true,
    form: {
      name: "",
      phone: "",
      province: "",
      city: "",
      district: "",
      detail: "",
      tag: 0,
      isDefault: 0
    }
  },

  computed: {
    isEdit: function () { return !!this.id; },
    regionText: function () {
      return util.regionText(this.form);
    }
  },

  created: function () {
    var id = util.param("id");
    this.id = id ? Number(id) : null;
    var self = this;
    util.loadRegions();
    if (this.isEdit) {
      this.load();
    } else {
      this.checkEmpty();
    }
  },

  methods: {
    goBack: function () { util.back(); },

    /* 收件地址必须落到一座具体的城市。
       「全国」只是浏览页的伪城市名，不是收件地址该有的粒度，
       所以这里直接把省市区全清掉，让用户重新选。 */
    onRegion: function (r) {
      this.picker = false;
      if (!r.city) {
        // 不管表单之前有没有填过区域，都要给一句解释。
        // 原来写成「只在已经有值时才提示」，结果新建地址时点「全国」→ 确定
        // 完全没反应，用户根本不知道该选到哪一级。
        this.form.province = "";
        this.form.city = "";
        this.form.district = "";
        this.$message.info("收件地址得选到城市这一级");
        return;
      }
      this.form.province = r.province;
      this.form.city = r.city;
      this.form.district = r.district;
    },

    load: function () {
      var self = this;
      return axios.get("/address/" + this.id)
        .then(function (res) {
          var a = res.data || {};
          self.form = {
            name: a.name || "",
            phone: a.phone || "",
            province: a.province || "",
            city: a.city || "",
            district: a.district || "",
            detail: a.detail || "",
            tag: Number(a.tag) || 0,
            isDefault: Number(a.isDefault) || 0
          };
          self.lockedDefault = self.form.isDefault === 1;
        })
        .catch(function (e) {
          self.$message.error(e);
          setTimeout(function () { util.go("/address.html"); }, 900);
        });
    },

    checkEmpty: function () {
      var self = this;
      axios.get("/address/list")
        .then(function (res) {
          self.hasAddress = !!(res.data && res.data.length);
        })
        .catch(function () { /* 拿不到就当有，只是少一句提示 */ });
    },

    /* 校验文案和后端 validateAndNormalize 一字不差。
       两边不一致的后果是"前端放行、后端拒绝"，用户不知道该改哪儿。 */
    validate: function () {
      var f = this.form;
      if (!(f.name || "").trim()) return "收货人不能为空";
      if (!(f.phone || "").trim()) return "手机号不能为空";
      if (!PHONE_RE.test((f.phone || "").trim())) return "手机号格式看着不对";
      if (!(f.province || "").trim()) return "请选择省份";
      if (!(f.city || "").trim()) return "请选择城市";
      if (!(f.detail || "").trim()) return "详细地址不能为空";
      return null;
    },

    payload: function () {
      var f = this.form;
      return {
        id: this.id,
        name: (f.name || "").trim(),
        phone: (f.phone || "").trim(),
        province: (f.province || "").trim(),
        city: (f.city || "").trim(),
        district: (f.district || "").trim(),
        detail: (f.detail || "").trim(),
        tag: Number(f.tag) || 0,
        isDefault: Number(f.isDefault) ? 1 : 0
      };
    },

    submit: function () {
      if (this.saving) return;
      var err = this.validate();
      if (err) { this.$message.error(err); return; }

      var self = this;
      this.saving = true;
      var req = this.isEdit
        ? axios.put("/address", this.payload())
        : axios.post("/address", this.payload());

      req.then(function () {
        self.$message.success(self.isEdit ? "已保存" : "地址已添加");
        setTimeout(function () { util.go("/address.html"); }, 500);
      }).catch(function (e) {
        self.$message.error(e);
      }).then(function () { self.saving = false; });
    },

    askDelete: function () { this.confirming = true; },

    doDelete: function () {
      if (this.deleting) return;
      var self = this;
      this.deleting = true;
      axios.delete("/address/" + this.id)
        .then(function () {
          self.confirming = false;
          self.$message.success("已删除");
          setTimeout(function () { util.go("/address.html"); }, 500);
        })
        .catch(function (e) { self.$message.error(e); })
        .then(function () { self.deleting = false; });
    }
  }
});
</script>
</body>
</html>
