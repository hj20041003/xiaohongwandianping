worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    charset utf-8;

    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # ---------- 前端静态资源 ----------
        # 相对路径基于 nginx.exe 所在目录解析，请务必在 nginx-1.18.0 目录下启动
        location / {
            root   html/xhw;
            index  index.html index.htm;
            charset utf-8;
        }

        # ---------- 开发期：HTML/CSS/JS 每次都向服务器校验 ----------
        # nginx 默认只回 Last-Modified + ETag，**不回 Cache-Control**。
        # 这种情况下浏览器会"启发式缓存"（按文件年龄的约 10% 估一个有效期），
        # 于是可能一段时间内直接拿本地旧副本、压根不问服务器。
        # 本项目前端是边改边看的，一旦命中就会看到改之前的页面，
        # 非常容易误判成"我改的代码没生效""新功能没上线"。
        #
        # 用 no-cache（注意不是 no-store）：仍然带 ETag 走 304 校验，
        # 只多一次极轻的往返，没有重新下载的带宽代价。
        # 放在 API 的 location 之前，保证静态文件优先匹配。
        # 图片不在此列 —— 它们本来就不常变，让浏览器正常缓存。
        location ~* \.(html|css|js)$ {
            root       html/xhw;
            add_header Cache-Control "no-cache";
        }

        location = /50x.html {
            root   html;
        }

        # ---------- 带 /api 前缀的请求（去掉前缀后转发）----------
        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            keepalive_timeout  30s;
        }

        # ---------- 后端业务接口 ----------
        # 这些前缀对应 @RequestMapping，由后端 8081 直接处理
        location ~ ^/(shop-type|shop|blog|blog-comments|user|follow|voucher|voucher-order|upload)/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            keepalive_timeout  30s;
        }

        # ---------- H2 数据库控制台（可选，方便用浏览器查数据）----------
        location /h2-console {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
    }

    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
    }
}
